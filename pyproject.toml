[project]
name = "say-chunker"
version = "0.1.0"
description = "Offline long-form text-to-MP3 audiobook converter using the macOS say engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24,<2",
    "pysbd>=0.3.4",
    "typer>=0.12",
]

[project.scripts]
tts = "say_chunker.cli:app"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["say_chunker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    "ignore::SyntaxWarning",
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pysbd.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "say_chunker.adapters.extractors.pdf_extractor"
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = ["tests.fixtures.build_fixtures", "tests.test_extractors"]
disable_error_code = ["no-untyped-call", "attr-defined"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001 flags intentional CJK and typographic punctuation used by the
# sentence splitter, chunker, and PDF line rules.
ignore = ["RUF001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
